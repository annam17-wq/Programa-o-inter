<!DOCTYPE html>
<html>
<body>

  <h3>Primos no Período</h3>

 
  Início: <input type="number" id="inicio" value=""><br><br>
  Fim: <input type="number" id="fim" value=""><br><br>
  <button onclick="calcular()">Verificar</button>

 
  <p id="resultado"></p>

  <script>
    function calcular() {
      let ini = parseInt(document.getElementById('inicio').value);
      let fim = parseInt(document.getElementById('fim').value);
      let primos = [];

     
      for (let i = ini; i <= fim; i++) {
        if (ehPrimo(i)) primos.push(i);
      }

      document.getElementById('resultado').innerText = "Primos: " + primos.join(", ");
    }


    function ehPrimo(n) {
      if (n <= 1) return false;
      for (let i = 2; i < n; i++) {
        if (n % i === 0) return false;
      }
      return true;
    }
  </script>

</body>
</html>
