<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <body>
  <button id="alertButton">Clique aqui</button>
  <input type="text" id="textInput" placeholder="Digite algo">
  <div id="hoverDiv">Passe o mouse aqui</div>
  <select id="colorSelect">
    <option value="">Escolha uma cor</option>
    <option value="blue">Azul</option>
    <option value="green">Verde</option>
    <option value="red">Vermelho</option>
  </select>
<script>
  document.getElementById("alertButton").addEventListener("click", () => {
    alert("Olá! Você clicou no botão.");
  });

  document.addEventListener("keydown", (event) => {
    console.log("Você pressionou uma tecla: " + event.key);
  });

  const input = document.getElementById("textInput");
  input.addEventListener("focus", () => {
    input.style.backgroundColor = "yellow";
  });

  input.addEventListener("blur", () => {
    input.style.backgroundColor = "white";
  });

  const div = document.getElementById("hoverDiv");
  div.addEventListener("mouseover", () => {
    div.style.backgroundColor = "pink";
  });

  div.addEventListener("mouseout", () => {
    div.style.backgroundColor = "white";
  });

  const select = document.getElementById("colorSelect");
  select.addEventListener("change", () => {
    document.body.style.backgroundColor = select.value;
  });
</script>
</body>
</body>
</html>
